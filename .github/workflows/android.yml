name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Rust y target ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar paquetes Android SDK y NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_BIN=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$CMDLINE_BIN" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          yes | "$CMDLINE_BIN" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-30" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"

      - name: Instalar cargo-apk
        run: cargo install cargo-apk

      - name: Compilar APK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_BIN="$SDK_DIR/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p /tmp/ndk-wrapper
          cat <<EOF > /tmp/ndk-wrapper/aarch64-linux-android-clang
          #!/usr/bin/env bash
          exec "$NDK_BIN/clang" "\$@" -Wl,--start-group -lc++_static -lc++abi -Wl,--end-group
          EOF
          chmod +x /tmp/ndk-wrapper/aarch64-linux-android-clang

          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_NDK_ROOT="$SDK_DIR/ndk/26.3.11579264"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="/tmp/ndk-wrapper/aarch64-linux-android-clang"
          export PATH="/tmp/ndk-wrapper:$PATH"

          cargo apk build --release --target aarch64-linux-android

      - name: Subir APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tjaloader-apk
          path: target/release/apk/*.apk
